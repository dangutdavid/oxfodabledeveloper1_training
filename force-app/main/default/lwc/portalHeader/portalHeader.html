<template>
    <header class="hero">
        <div class="hero-inner">
            <div class="brand">
                <span class="mark">🚀</span>
                <span class="name">Career<span class="accent">Launch</span></span>
            </div>
            <nav class="nav">
                <a class={homeLinkClass} href={homeUrl}>{labels.home}</a>
                <template lwc:if={isGuest}>
                    <a class="auth-link" href={authUrl}>{authLabel}</a>
                </template>
                <template lwc:else>
                    <a class={profileLinkClass} href={profileUrl}>{labels.profile}</a>
                    <a class="auth-link" href={authUrl}>{authLabel}</a>
                </template>
            </nav>
        </div>
        <div class="hero-copy">
            <h1>{heroTitle}</h1>
            <p>{heroSubtitle}</p>
        </div>
    </header>
</template>
