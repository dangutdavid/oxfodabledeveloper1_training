<template>
    <lightning-card title={labels.title} icon-name="standard:invoice">
        <div class="slds-var-p-horizontal_medium">

            <template if:true={error}>
                <div class="slds-text-color_error slds-var-p-vertical_small">{error}</div>
            </template>

            <template if:true={isEmpty}>
                <div class="slds-text-color_weak slds-var-p-vertical_small">{labels.empty}</div>
            </template>

            <template if:true={hasInvoices}>
                <ul class="slds-has-dividers_bottom-space">
                    <template for:each={invoices} for:item="invoice">
                        <li key={invoice.id} class="slds-item">
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                <div>
                                    <p class="slds-text-heading_small">
                                        {invoice.invoiceNumber} &middot; {invoice.courseName}
                                    </p>
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        {invoice.amountDisplay} &middot; due
                                        <lightning-formatted-date-time value={invoice.dueDate}>
                                        </lightning-formatted-date-time>
                                    </p>
                                </div>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <lightning-badge label={invoice.status}
                                                     class="slds-var-m-right_small">
                                    </lightning-badge>
                                    <template if:true={invoice.payable}>
                                        <lightning-button variant="brand"
                                                          label={labels.payNow}
                                                          data-id={invoice.id}
                                                          onclick={handlePay}>
                                        </lightning-button>
                                    </template>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>

        </div>
    </lightning-card>
</template>
